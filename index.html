<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Lifelines</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: night sky on the left (live 9:16 preview), people editor on the right; stacked on phones. One deliberate night look. */
:root {
  --night: #080a1c;
  --panel: #11142c;
  --panel-2: #181c3a;
  --line: #2a2e55;
  --ink: #ecebf7;
  --muted: #9093b8;
  --gold: #f4c46a;
  --rose: #ff7d8e;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html { min-height: 100%; background: var(--night); }
body {
  min-height: 100vh; margin: 0;
  background: radial-gradient(1200px 700px at 20% -10%, #1a1840 0%, transparent 60%) fixed, var(--night);
  color: var(--ink);
  font: 15px/1.5 var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
header { max-width: 1240px; margin: 0 auto 18px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font: 600 2.4rem/1 var(--display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 em { color: var(--gold); font-style: italic; font-weight: 500; }
.lede { color: var(--muted); margin: 0; max-width: 62ch; }
.app { max-width: 1240px; margin: 0 auto; display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 920px) { .app { grid-template-columns: minmax(0, 1fr) 470px; align-items: start; } .stage { position: sticky; top: max(16px, env(safe-area-inset-top, 0px)); } }
.stage { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
/* the preview is a player: play, scrub and the clock sit on its lower edge and step aside while it plays */
.screen { position: relative; max-width: 100%; border-radius: 14px; box-shadow: 0 0 0 1px var(--line), 0 30px 80px -30px #000; }
canvas#sky { display: block; aspect-ratio: 9 / 16; height: min(calc(100vh - 255px), 1280px); max-width: 100%; border-radius: 14px; background: #070918; }
.player { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 34px 14px 12px; border-radius: 0 0 14px 14px;
  background: linear-gradient(rgba(5,6,20,0), rgba(5,6,20,.88) 55%); transition: opacity .35s; }
.player input[type=range] { flex: 1 1 auto; min-width: 0; accent-color: var(--gold); }
.player .clock { color: #cfd0ec; font-size: 12px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.player button { width: 40px; height: 40px; padding: 0; border-radius: 50%; display: grid; place-items: center; flex: none; background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.18); font-size: 15px; }
@media (hover: hover) { .screen.playing:not(:hover):not(:focus-within) .player { opacity: 0; } }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; width: min(100%, 540px); }
.actions .primary { padding: 11px 22px; font-size: 15px; }
@media (max-width: 919px) { .screen { width: min(100%, 460px); } canvas#sky { height: auto; width: 100%; } }
.controls { display: flex; align-items: center; gap: 10px; width: min(100%, 540px); flex-wrap: wrap; }
.controls input[type=range] { flex: 1 1 160px; min-width: 0; accent-color: var(--gold); }
.clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
button { font: 500 14px var(--ui); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 14px; cursor: pointer; }
button:hover { border-color: #444a85; }
button:focus-visible, input:focus-visible, select:focus-visible, .handle:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button.primary { background: var(--gold); color: #1d1606; border-color: var(--gold); font-weight: 600; }
button.primary:hover { filter: brightness(1.06); }
button:disabled { opacity: .5; cursor: default; }
.icon { padding: 5px 8px; line-height: 1; min-width: 30px; }
.status { font-size: 13px; color: var(--muted); min-height: 1.4em; text-align: center; width: min(100%, 540px); }
.status.ok { color: #8fe3b0; } .status.err { color: var(--rose); }
video#preview { width: min(100%, 300px); border-radius: 10px; border: 1px solid var(--line); }

.editor { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.editor h2 { font: 600 1.45rem/1.1 var(--display); margin: 0; }
.editor h3 { font: 600 12px var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.note { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
.sample { display: inline-block; font: 600 11px var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); border: 1px solid #5a4a24; border-radius: 99px; padding: 1px 8px; margin-left: 6px; vertical-align: 3px; }
.people { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 10px 6px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 6px; transition: box-shadow .15s; }
.card > .body { display: grid; gap: 8px; min-width: 0; }
.card.me { border-color: #6b5527; background: linear-gradient(#1f1d36, #1a1934); }
.card.dragging { box-shadow: 0 0 0 2px var(--gold), 0 14px 30px -10px #000; position: relative; z-index: 2; }
.handle { grid-row: 1 / span 2; align-self: stretch; display: grid; place-items: center; width: 22px; border-radius: 6px; color: #6b6f9c; cursor: grab; touch-action: none; user-select: none; font-size: 16px; }
.handle:hover { color: var(--ink); background: #22264a; }
.dragging .handle { cursor: grabbing; }
.row { display: flex; gap: 6px; align-items: center; min-width: 0; }
.row > .grow { flex: 1 1 auto; min-width: 0; }
.years { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
label.f { display: flex; flex-direction: column; gap: 2px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); min-width: 0; }
input[type=text], input[type=number], select { font: 14px var(--ui); color: var(--ink); background: #0c0e22; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; text-transform: none; letter-spacing: 0; }
input::placeholder { color: #5d6088; }
select.role { flex: 0 0 8.4rem; width: 8.4rem; }
input[type=color] { width: 30px; height: 30px; padding: 0; border: none; background: none; cursor: pointer; flex: none; border-radius: 50%; }
input[type=color]::-webkit-color-swatch-wrapper { padding: 3px; }
input[type=color]::-webkit-color-swatch { border-radius: 50%; border: none; }
input[type=color]::-moz-color-swatch { border-radius: 50%; border: none; }
.swatch { position: relative; flex: none; display: flex; }
.swatch .custom { position: absolute; right: -3px; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel-2); }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink); text-transform: none; letter-spacing: 0; }
.check input { accent-color: var(--gold); width: 16px; height: 16px; }
.section { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.palette label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.legend { font-size: 13px; color: var(--muted); display: grid; gap: 3px; margin: 0; padding-left: 18px; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.years.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.controls.viewer { justify-content: center; font-size: 13px; color: var(--muted); }
.controls.viewer select { width: auto; max-width: 60%; }
.viewer-note { text-align: center; width: min(100%, 540px); margin: -4px 0 0; }
.viewer-note:empty { display: none; }
.card { padding: 4px 8px 4px 4px; align-items: center; }
.card.open { padding: 8px 10px 10px 4px; align-items: start; }
.summary { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 12px minmax(0, 1fr) minmax(56px, 92px) auto 12px; gap: 10px; align-items: center; width: 100%; padding: 6px 2px; border-radius: 8px; }
.summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.summary .dot { width: 12px; height: 12px; border-radius: 50%; }
.summary .who { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.summary .who b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.summary .who small { color: var(--muted); font-size: 11.5px; }
.summary .span { position: relative; height: 4px; border-radius: 2px; background: #262a52; }
.summary .span i { position: absolute; top: 0; bottom: 0; border-radius: 2px; opacity: .9; }
.summary .span em { position: absolute; top: -8px; transform: translateX(-50%); font: normal 10px var(--ui); color: #fff; }
.summary .yrs { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.summary .chev { color: var(--muted); font-size: 18px; transition: transform .2s; text-align: center; }
.card.open .summary .chev { transform: rotate(90deg); }
.card.open .summary { border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; padding-bottom: 10px; margin-bottom: 2px; }

/* --- bilingual header, player, tabs --- */
header { align-items: center; }
.head-text { flex: 1 1 320px; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 3px; background: var(--panel); flex: none; }
.lang button { border: 0; background: none; border-radius: 99px; padding: 5px 13px; font-size: 13px; color: var(--muted); }
.lang button[aria-pressed=true] { background: var(--gold); color: #1d1606; font-weight: 600; }
.screen { overflow: hidden; }
canvas#sky { cursor: pointer; }
.player { flex-direction: column; align-items: stretch; gap: 2px; padding: 44px 12px 10px; }
.player .clock { max-width: none; padding-left: 4px; font-size: 13px; }
.bar { display: flex; align-items: center; gap: 8px; }
.track { position: relative; flex: 1 1 auto; min-width: 0; display: flex; align-items: center; height: 40px; }
.track input[type=range] { width: 100%; margin: 0; }
.marks { position: absolute; left: 8px; right: 8px; top: 0; height: 14px; pointer-events: none; }
.marks button { all: unset; position: absolute; top: 0; width: 14px; height: 14px; margin-left: -7px; display: grid; place-items: center; cursor: pointer; pointer-events: auto; font-size: 10px; line-height: 1; border-radius: 50%; }
.marks button::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
.marks button.star::before { content: "✦"; width: auto; height: auto; background: none; color: var(--c); box-shadow: none; text-shadow: 0 0 6px var(--c); }
.marks button.future { opacity: .5; }
.marks button:hover { transform: scale(1.5); }
.marks button:focus-visible { outline: 2px solid var(--gold); }
#music.off { opacity: .5; text-decoration: line-through; }
.bigplay { position: absolute; left: 50%; top: 66%; transform: translate(-50%, -50%); width: 78px; height: 78px; border-radius: 50%; padding: 0 0 0 5px; font-size: 26px;
  color: var(--gold); background: rgba(10,12,34,.55); border: 1.5px solid var(--gold); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  box-shadow: 0 0 0 9px rgba(244,196,106,.10), 0 0 50px rgba(244,196,106,.35); transition: transform .2s, opacity .25s; }
.bigplay:hover { transform: translate(-50%, -50%) scale(1.07); }
.screen.playing .bigplay { opacity: 0; pointer-events: none; }
.screen:fullscreen { display: grid; place-items: center; background: #000; border-radius: 0; }
.screen:fullscreen canvas#sky { height: 100vh; width: auto; max-width: 100vw; border-radius: 0; }
.keys { text-align: center; margin: 0; width: min(100%, 540px); font-size: 12px; }
@media (hover: none) { .keys { display: none; } }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #0c0e22; border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tabs button { border: 0; background: none; color: var(--muted); border-radius: 9px; padding: 9px 10px; }
.tabs button[aria-selected=true] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.tab { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.add button { display: inline-flex; align-items: center; gap: 7px; border-radius: 99px; padding: 6px 12px 6px 10px; }
.add button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); box-shadow: 0 0 8px var(--c, transparent); }
@media (max-width: 480px) { .summary { grid-template-columns: 12px minmax(0, 1fr) auto 12px; } .summary .span { display: none; } }
details.how { border-top: 1px solid var(--line); padding-top: 14px; }
details.how summary { cursor: pointer; color: var(--muted); font: 600 12px var(--ui); letter-spacing: .08em; text-transform: uppercase; }
details.how .legend { margin-top: 10px; }
button.armed { border-color: var(--rose); color: var(--rose); }
.speedlab { display: flex; flex-wrap: wrap; gap: 0 6px; }
@media (prefers-reduced-motion: reduce) { .bigplay, .player, .summary .chev { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="head-text">
    <h1>Life<em>lines</em></h1>
    <p class="lede" data-i18n="lede">Every colored line is one person in your life. Those who drift apart fade off to the side. Those who pass away rise into your sky as stars.</p>
  </div>
  <div class="lang" role="group" aria-label="Jazyk / Language">
    <button type="button" id="langCs" lang="cs" aria-pressed="false">Česky</button>
    <button type="button" id="langEn" lang="en" aria-pressed="false">English</button>
  </div>
</header>

<main class="app">
  <section class="stage" data-i18n-aria="stageAria">
    <div class="controls viewer">
      <label for="viewer" data-i18n="whose">Whose story</label>
      <select id="viewer"></select>
    </div>
    <p id="viewerNote" class="note viewer-note"></p>
    <div class="screen" id="screen">
      <canvas id="sky" width="720" height="1280"></canvas>
      <button id="bigplay" class="bigplay" type="button" data-i18n-aria="play">▶</button>
      <div class="player">
        <span id="clock" class="clock"></span>
        <div class="bar">
          <button id="play" type="button" aria-label="Play">▶</button>
          <div class="track">
            <div id="marks" class="marks"></div>
            <input id="scrub" type="range" min="-2" max="100" step="0.05" value="0" data-i18n-aria="scrubAria">
          </div>
          <button id="music" type="button" aria-pressed="true">♪</button>
          <button id="fs" type="button">⤢</button>
        </div>
      </div>
    </div>
    <div class="actions">
      <button id="record" class="primary" type="button">● Record video</button>
      <button id="restart" type="button" data-i18n="restart">↺ From the start</button>
    </div>
    <p class="note keys" data-i18n="keys"></p>
    <div id="status" class="status" role="status"></div>
    <video id="preview" controls playsinline hidden></video>
  </section>

  <aside class="editor" data-i18n-aria="editorAria">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabBtnPeople" aria-controls="tabPeople" aria-selected="true" data-i18n="tabPeople">People</button>
      <button type="button" role="tab" id="tabBtnLook" aria-controls="tabLook" aria-selected="false" data-i18n="tabLook">Look &amp; words</button>
    </div>

    <div id="tabPeople" class="tab" role="tabpanel" aria-labelledby="tabBtnPeople">
      <div>
        <h2><span data-i18n="peopleH">People in your story</span> <span id="sampleBadge" class="sample" data-i18n="example">example</span></h2>
        <p id="sampleNote" class="note" data-i18n="sampleNote"></p>
        <p class="note" data-i18n="peopleNote"></p>
      </div>
      <div id="people" class="people"></div>
      <div class="tools add">
        <button id="addParent" type="button" data-role="parent"></button>
        <button id="addGrand" type="button" data-role="grandparent"></button>
        <button id="addSibling" type="button" data-role="sibling"></button>
        <button id="addPartner" type="button" data-role="partner"></button>
        <button id="addChild" type="button" data-role="child"></button>
        <button id="addFriend" type="button" data-role="friend"></button>
      </div>
      <div class="tools">
        <button id="arrange" type="button" data-i18n="arrange">Arrange as family tree</button>
      </div>
      <details class="how">
        <summary data-i18n="howH">How it works</summary>
        <ul class="legend">
          <li data-i18n-html="lg1"></li><li data-i18n-html="lg2"></li><li data-i18n-html="lg3"></li>
          <li data-i18n-html="lg4"></li><li data-i18n-html="lg5"></li><li data-i18n-html="lg6"></li>
        </ul>
      </details>
      <div class="section">
        <h3 data-i18n="dataH">Your data</h3>
        <p class="note" style="margin:0" data-i18n="dataNote"></p>
        <div class="tools">
          <button id="saveFile" type="button" data-i18n="saveFile"></button>
          <button id="loadFile" type="button" data-i18n="loadFile"></button>
          <input id="fileIn" type="file" accept="application/json,.json" hidden>
          <button id="justMe" type="button" data-i18n="justMe"></button>
          <button id="reset" type="button" data-i18n="reset"></button>
        </div>
        <div id="dataStatus" class="note" role="status" style="margin:0"></div>
      </div>
    </div>

    <div id="tabLook" class="tab" role="tabpanel" aria-labelledby="tabBtnLook" hidden>
      <div class="section" style="border-top:0;padding-top:0">
        <h3 data-i18n="colorsH">Colors by relationship</h3>
        <div id="palette" class="palette"></div>
      </div>
      <div class="section">
        <label class="f"><span class="speedlab"><span data-i18n="speed"></span><span id="dur" style="text-transform:none;letter-spacing:0"></span></span>
          <input id="speed" type="range" min="0.3" max="1.6" step="0.05" style="accent-color:var(--gold)">
        </label>
        <label class="check"><input type="checkbox" id="linger"> <span data-i18n="linger"></span></label>
        <label class="check"><input type="checkbox" id="captions"> <span data-i18n="captions"></span></label>
        <label class="check"><input type="checkbox" id="markFuture"> <span data-i18n="markFuture"></span></label>
      </div>
      <div class="section">
        <label class="f"><span data-i18n="closingWords"></span><select id="closing"></select></label>
        <label class="f"><span data-i18n="closingTitle"></span><input id="line1" type="text"></label>
        <label class="f"><span data-i18n="closingLine"></span><input id="line2" type="text"></label>
      </div>
    </div>
  </aside>
</main>

<script>
(() => {
const W = 720, H = 1280, NOW_Y = Math.round(H * 0.47), PPY = H * 0.052, T0 = -14, STEP = 0.02, TSTART = -2; // the video opens two years before you are born
const VIS = (H - NOW_Y) / PPY + 0.5, LEAVE_YEARS = 2.6, CAP_YEARS = 2.2;
const STORE = "lifelines-v2";
// ---------- language: Czech and English, switchable at any time ----------
const LANG_STORE = "lifelines-lang";
let lang = "";
try { lang = localStorage.getItem(LANG_STORE) || ""; } catch (e) {}
if (lang !== "cs" && lang !== "en") lang = /^(cs|sk)/i.test(navigator.language || "") ? "cs" : "en";
const ROLE_KEYS = ["grandparent", "parent", "sibling", "partner", "child", "grandchild", "friend", "other"];
const L = {
  en: {
    lede: "Every colored line is one person in your life. Those who drift apart fade off to the side. Those who pass away rise into your sky as stars.",
    stageAria: "Animation preview", editorAria: "People and settings", whose: "Whose story", play: "Play", pause: "Pause", scrubAria: "Scrub through time",
    record: "● Record video", saveVideo: "⬇ Save video", restart: "↺ From the start", musicOn: "Music on", musicOff: "Music off", fs: "Full screen",
    keys: "Space plays and pauses · ← → move one year · dots on the timeline jump to the big moments",
    tabPeople: "People", tabLook: "Look & words", peopleH: "People in your story", example: "example",
    sampleNote: "This is an example family. Replace it with your own people, or start with just yourself.",
    peopleNote: "Click a person to edit them. Top to bottom in the list is left to right in the sky; drag ⠿ to reorder.",
    arrange: "Arrange as family tree", howH: "How it works",
    lg1: "<b>Joined</b>: the year they came into your life (empty = there from the start).",
    lg2: "<b>Left</b>: the year your paths parted. Their line drifts away.",
    lg3: "<b>Died</b>: they rise into the sky as a star.",
    lg4: "A child's line grows out of both parents' lines. Pick the other parent under <b>Child with</b>.",
    lg5: "Stars connect by kinship: children to both parents, partners to each other.",
    lg6: "<b>Whose story</b> (above the preview) tells the same family from anyone's point of view. Use real names so the labels work for everyone, and add birth years.",
    colorsH: "Colors by relationship", speed: "Speed (seconds per year)",
    linger: "Slow down at big moments, speed through quiet years",
    captions: "Show captions for big moments (births, meetings, stars)",
    markFuture: "Show the years after today as imagined (dashed lines)",
    closingWords: "Closing words", closingTitle: "Closing title", closingLine: "Closing line", ownWords: "Your own words",
    dataH: "Your data", dataNote: "Everything stays in this browser only. Save a file to keep a backup or to move your story to another device.",
    saveFile: "Save to a file", loadFile: "Load from a file", justMe: "Start with just me", reset: "Restore the example family", sure: "Click again to confirm",
    fileSaved: "Saved.", fileLoaded: "Loaded.", fileBad: "That file doesn't look like a Lifelines story.", fileFail: "Couldn't save the file.",

  if (!window.MediaRecorder || !cv.captureStream) { setStatus(T("stNoRec"), "err"); return; }
  const au = musicOn ? initAudio() : null;
  const types = au ? ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm"] : ["video/mp4;codecs=avc1.42E01E", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
  const type = types.find(x => MediaRecorder.isTypeSupported(x));
  if (!type) { setStatus(T("stNoFmt"), "err"); return; }
  const chunks = [], stream = cv.captureStream(30);
  if (au) au.dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
  try { recorder = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 5e6 }); }
  catch (e) { recorder = null; setStatus(T("stNoStart"), "err"); return; }
  recorder.ondataavailable = ev => { if (ev.data.size) chunks.push(ev.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: type.split(";")[0] });
    lastVideo = { blob, ext: type.startsWith("video/mp4") ? "mp4" : "webm" };
    recorder = null;
    preview.src = URL.createObjectURL(blob); preview.hidden = false;
    recBtn.textContent = T("saveVideo"); recBtn.dataset.mode = "save"; recBtn.disabled = false;
    setStatus(T("stDone", (blob.size / 1048576).toFixed(1), lastVideo.ext.toUpperCase()), "ok");
    recBtn.focus();
  };
  t = TSTART; sim = null; dust.length = 0; recorder.start(500); setPlaying(true);
  recBtn.disabled = true; setStatus(T("stRec"), "");
};
function invalidateVideo() { if (recBtn.dataset.mode === "save") { recBtn.dataset.mode = ""; recBtn.textContent = T("record"); lastVideo = null; preview.hidden = true; } }

// ---------- editor ----------
const peopleEl = document.getElementById("people");
const changed = () => { sim = null; VIEW = null; save(); invalidateVideo(); renderViewer(); updateDuration(); markSample(); tintAdd(); };
function markSample() { const s = isSample(); document.getElementById("sampleBadge").hidden = !s; document.getElementById("sampleNote").hidden = !s; }
function tintAdd() { for (const b of document.querySelectorAll(".add button")) b.style.setProperty("--c", S.colors[b.dataset.role]); }
const viewerSel = document.getElementById("viewer"), viewerNote = document.getElementById("viewerNote");
function renderViewer() {
  const G = familyGraph(), opts = S.people.filter(p => G.N.has(p.id));
  if (!G.N.has(S.viewer)) S.viewer = "me";
  viewerSel.replaceChildren(...opts.map(p => el("option", { value: p.id, textContent: `${(p.name || "").trim() || "?"} (${p.id === "me" ? T("you") : T("rel_" + p.role)})`, selected: p.id === S.viewer })));
  const V = view();
  if (V.vid === "me") { viewerNote.textContent = ""; return; }
  const X = S.people.find(p => p.id === V.vid);
  viewerNote.textContent = [
    V.estimated ? T("noteEst", X.name || "?", V.birth) : "",
    V.endFromDeath ? "" : T("noteEnd", V.birth + V.endAge),
    T("noteFriends")
  ].filter(Boolean).join(" ");
}
viewerSel.onchange = () => { S.viewer = viewerSel.value; changed(); t = Math.min(t, tEnd()); };
function updateDuration() { const s = Math.round(videoSeconds()); document.getElementById("dur").textContent = `· video ≈ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
const el = (tag, attrs = {}, kids = []) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "on") for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn); else if (k in n && k !== "list") n[k] = v; else n.setAttribute(k, v); } kids.forEach(c => c != null && c !== "" && n.append(c)); return n; };
function moveTo(id, idx) { const i = S.people.findIndex(p => p.id === id); const [p] = S.people.splice(i, 1); S.people.splice(clamp(idx, 0, S.people.length), 0, p); changed(); }

function yearField(label, p, key, ph) {
  return el("label", { className: "f" }, [label, el("input", { type: "number", id: `${p.id}-${key}`, value: p[key] ?? "", placeholder: ph, inputMode: "numeric",
    on: { input: ev => { p[key] = ev.target.value === "" ? "" : +ev.target.value; changed(); } } })]);
}
function ofField(p) {
  const rel = p.role === "grandparent" ? "parent" : "child";
  const opts = S.people.filter(q => q.role === rel);
  if (!opts.length) return null;
  return el("label", { className: "f" }, [T(p.role === "grandparent" ? "parentOf" : "childOf"),
    el("select", { id: `${p.id}-of`, on: { change: ev => { p.of = ev.target.value; changed(); } } },
      opts.map(q => el("option", { value: q.id, textContent: q.name || "?", selected: (p.of || opts[0].id) === q.id })))]);
}
// a child's other parent: their line branches out of both of you
function withField(p) {
  const opts = by("partner"), cur = otherParent(p) || "none";
  return el("label", { className: "f" }, [T("childWith"),
    el("select", { id: `${p.id}-with`, on: { change: ev => { p.with = ev.target.value; changed(); } } }, [
      ...opts.map(q => el("option", { value: q.id, textContent: q.name || "?", selected: cur === q.id })),
      el("option", { value: "none", textContent: T(opts.length ? "notListed" : "noPartner"), selected: cur === "none" })])]);
}
function estBorn(p) { const G = familyGraph(); return G.N.has(p.id) ? "≈" + G.bornOf(p.id) : ""; }
function yearsFor(p) {
  const r = p.role, born = () => yearField(T("born"), p, "born", estBorn(p));
  if (r === "partner") return el("div", { className: "years four" }, [born(), yearField(T("together"), p, "from", T("phAlways")), yearField(T("parted"), p, "to", T("phStays")), yearField(T("died"), p, "death", "—")]);
  if (r === "parent" || r === "grandparent" || r === "sibling") return el("div", { className: "years" }, [born(), yearField(T("left"), p, "to", T("phStays")), yearField(T("died"), p, "death", "—")]);
  if (r === "child" || r === "grandchild") return el("div", { className: "years" }, [yearField(T("born"), p, "from", T("phYear")), yearField(T("left"), p, "to", T("phStays")), yearField(T("died"), p, "death", "—")]);
  return el("div", { className: "years" }, [yearField(T("joined"), p, "from", T("phStart")), yearField(T("left"), p, "to", T("phStays")), yearField(T("died"), p, "death", "—")]);
}

function startDrag(ev, card, id) {
  if (ev.button !== 0) return;
  ev.preventDefault();
  const handle = ev.currentTarget;
  try { handle.setPointerCapture(ev.pointerId); } catch (e) {}
  card.classList.add("dragging");
  const startY = ev.clientY, startTop = card.getBoundingClientRect().top;
  const move = e => {
    const others = [...peopleEl.children].filter(c => c !== card);
    const mid = e.clientY - startY + startTop + card.offsetHeight / 2;
    let idx = others.findIndex(c => { const r = c.getBoundingClientRect(); return mid < r.top + r.height / 2; });
    if (idx < 0) idx = others.length;
    if (idx !== [...peopleEl.children].indexOf(card)) {
      peopleEl.insertBefore(card, others[idx] || null);
      moveTo(id, idx);
    }
  };
  const up = () => { handle.removeEventListener("pointermove", move); handle.removeEventListener("pointerup", up); handle.removeEventListener("pointercancel", up); card.classList.remove("dragging"); render(); document.getElementById(`${id}-handle`)?.focus(); };
  handle.addEventListener("pointermove", move); handle.addEventListener("pointerup", up); handle.addEventListener("pointercancel", up);
}

// one line per person: color, name, relationship and a small bar of when they are in your life
let openId = null;
function lifeSpan(p) {
  if (p.id === "me") return [num(S.birth), num(S.end), !!S.meStar];
  const start = p.role === "sibling" ? num(p.born) : num(p.from);
  const death = num(p.death);
  return [start, num(p.to) ?? death, death != null && (num(p.to) == null || death <= num(p.to))];
}
function summaryOf(p, col) {
  const isMe = p.id === "me", b = num(S.birth) ?? 1985, lo = b - 2, hi = Math.max(num(S.end) ?? b + 85, lo + 10);
  const [s, e, star] = lifeSpan(p), pct = y => clamp((y - lo) / (hi - lo) * 100, 0, 100);
  const from = s == null ? 0 : pct(s), to = e == null ? 100 : pct(e);
  const years = isMe ? `${s ?? "?"}–${e ?? ""}` : `${s ?? "…"}–${e ?? ""}`;
  return [
    el("span", { className: "dot", style: `background:${col};box-shadow:0 0 10px ${hexA(col, .7)}` }),
    el("span", { className: "who" }, [el("b", { textContent: (p.name || "").trim() || T("unnamed") }), el("small", { textContent: isMe ? T("you") : T("role_" + p.role) })]),
    el("span", { className: "span", "aria-hidden": "true" }, [el("i", { style: `left:${from}%;width:${Math.max(1.5, to - from)}%;background:${col}` }), star && e != null ? el("em", { style: `left:${to}%`, textContent: "✦" }) : null]),
    el("span", { className: "yrs", textContent: years + (star && e != null ? " ✦" : "") + (!isMe && !star && num(p.death) != null ? ` · ✦${num(p.death)}` : "") }),
    el("span", { className: "chev", "aria-hidden": "true", textContent: "›" })
  ];
}
function render() {
  peopleEl.replaceChildren();
  S.people.forEach((p, i) => {
    const isMe = p.id === "me", col = colorOf(p);
    const jump = idx => () => { moveTo(p.id, idx); render(); };
    const handle = el("div", { className: "handle", id: `${p.id}-handle`, tabIndex: 0, role: "button", textContent: "⠿", title: T("dragTitle"), "aria-label": T("dragTitle") });
    handle.addEventListener("keydown", ev => {
      const d = { ArrowUp: -1, ArrowDown: 1 }[ev.key]; if (!d) return;
      ev.preventDefault(); moveTo(p.id, i + d); render(); document.getElementById(`${p.id}-handle`).focus();
    });
    const swatch = el("span", { className: "swatch" }, [
      el("input", { type: "color", id: `${p.id}-color`, value: col, title: T(isMe ? "yourColor" : "ownColor"),
        on: { input: ev => { if (isMe) S.colors.me = ev.target.value; else p.color = ev.target.value; changed(); }, change: () => render() } }),
      !isMe && p.color ? el("span", { className: "custom", title: T("customColor") }) : null
    ]);
    const top = el("div", { className: "row" }, [
      swatch,
      el("input", { type: "text", id: `${p.id}-name`, className: "grow", value: p.name, placeholder: T("name"), "aria-label": T("name"), on: { input: ev => { p.name = ev.target.value; changed(); } } }),
      isMe ? el("span", { className: "note", style: "margin:0;white-space:nowrap" }, [T("thatsYou")]) :
        el("select", { id: `${p.id}-role`, className: "role", "aria-label": T("relationship"), on: { change: ev => { p.role = ev.target.value; delete p.of; delete p.with; changed(); render(); } } },
          ROLE_KEYS.map(v => el("option", { value: v, textContent: T("role_" + v), selected: p.role === v }))),
      !isMe && p.color ? el("button", { type: "button", className: "icon", textContent: "◐", title: T("resetColor"), on: { click: () => { delete p.color; changed(); render(); } } }) : null,
      el("button", { type: "button", className: "icon", textContent: "⤒", title: T("toTop"), disabled: i === 0, on: { click: jump(0) } }),
      el("button", { type: "button", className: "icon", textContent: "⤓", title: T("toBottom"), disabled: i === S.people.length - 1, on: { click: jump(S.people.length) } }),
      isMe ? null : el("button", { type: "button", className: "icon", textContent: "×", title: T("remove"), on: { click: () => { S.people.splice(i, 1); changed(); render(); } } })
    ]);
    const years = isMe
      ? el("div", { className: "years" }, [
          el("label", { className: "f" }, [T("born"), el("input", { type: "number", id: "me-birth", value: S.birth, on: { input: ev => { S.birth = ev.target.value; changed(); } } })]),
          el("label", { className: "f" }, [T("storyEnds"), el("input", { type: "number", id: "me-end", value: S.end, on: { input: ev => { S.end = ev.target.value; changed(); } } })]),
          el("label", { className: "check", style: "align-self:end;padding-bottom:6px" }, [el("input", { type: "checkbox", id: "me-star", checked: !!S.meStar, on: { change: ev => { S.meStar = ev.target.checked; changed(); } } }), T("becomeStar")])
        ])
      : yearsFor(p);
    const open = openId === p.id;
    const summary = el("button", { type: "button", className: "summary", id: `${p.id}-summary`, "aria-expanded": open, title: T(open ? "close" : "edit"),
      on: { click: () => { openId = open ? null : p.id; render(); document.getElementById(`${p.id}-summary`)?.focus(); } } }, summaryOf(p, col));
    const body = el("div", { className: "body" }, open
      ? [summary, top, years, (p.role === "grandparent" || p.role === "grandchild") ? ofField(p) : p.role === "child" ? withField(p) : null]
      : [summary]);
    const card = el("div", { className: "card" + (isMe ? " me" : "") + (open ? " open" : "") }, [handle, body]);
    handle.addEventListener("pointerdown", ev => startDrag(ev, card, p.id));
    peopleEl.append(card);
  });
}

function renderPalette() {
  const pal = document.getElementById("palette");
  pal.replaceChildren(...["me", ...ROLE_KEYS].map(k => [k, T(k === "me" ? "youCap" : "role_" + k)]).map(([k, label]) =>
    el("label", {}, [el("input", { type: "color", id: `color-${k}`, value: S.colors[k], on: { input: ev => { S.colors[k] = ev.target.value; changed(); }, change: () => render() } }), label])));
}

document.getElementById("arrange").onclick = () => { S.people = arrangeOrder(S.people); changed(); render(); };

function addPerson(role, name, side) {
  const b = num(S.birth) ?? 1985, nowY = new Date().getFullYear();
  const born = { child: b + 30, grandchild: b + 58, partner: b + 25, friend: b + 10, sibling: b + 3 };
  const p = { id: "p" + Date.now().toString(36), name, role, from: role === "parent" || role === "grandparent" ? "" : Math.min(nowY, born[role] ?? b + 10),
    to: role === "friend" ? Math.min(nowY, b + 18) : "", death: "" };
  const mi = S.people.findIndex(q => q.id === "me");
  S.people.splice(side === "left" ? mi : mi + 1, 0, p); openId = p.id; changed(); render();
  document.getElementById(`${p.id}-name`).select();
}
document.getElementById("addParent").onclick = () => addPerson("parent", T("role_parent"), "right");
document.getElementById("addGrand").onclick = () => addPerson("grandparent", T("role_grandparent"), "left");
document.getElementById("addSibling").onclick = () => addPerson("sibling", T("role_sibling"), "right");
document.getElementById("addPartner").onclick = () => addPerson("partner", T("role_partner"), "left");
document.getElementById("addChild").onclick = () => addPerson("child", T("role_child"), "left");
document.getElementById("addFriend").onclick = () => addPerson("friend", T("role_friend"), "right");

const speed = document.getElementById("speed"), line1 = document.getElementById("line1"), line2 = document.getElementById("line2");
const lingerBox = document.getElementById("linger"), futureBox = document.getElementById("markFuture"), capBox = document.getElementById("captions");
capBox.onchange = () => { S.captions = capBox.checked; save(); invalidateVideo(); };
const closingSel = document.getElementById("closing");
function syncClosing() {
  const i = CLOSINGS().findIndex(([a, b]) => a === S.line1 && b === S.line2);
  closingSel.replaceChildren(...CLOSINGS().map(([a, b], k) => el("option", { value: k, textContent: `${a} — ${b}`, selected: k === i })),
    el("option", { value: "own", textContent: T("ownWords"), selected: i < 0 }));
}
closingSel.onchange = () => { const c = CLOSINGS()[+closingSel.value]; if (!c) return; [S.line1, S.line2] = c; line1.value = c[0]; line2.value = c[1]; save(); invalidateVideo(); };
function syncSettings() { syncClosing(); speed.value = S.secPerYear; line1.value = S.line1; line2.value = S.line2; lingerBox.checked = S.linger !== false; capBox.checked = S.captions !== false; futureBox.checked = S.markFuture !== false; }
speed.oninput = () => { S.secPerYear = +speed.value; save(); invalidateVideo(); updateDuration(); };
lingerBox.onchange = () => { S.linger = lingerBox.checked; save(); invalidateVideo(); updateDuration(); };
futureBox.onchange = () => { S.markFuture = futureBox.checked; save(); invalidateVideo(); };
line1.oninput = () => { S.line1 = line1.value; save(); invalidateVideo(); syncClosing(); };
line2.oninput = () => { S.line2 = line2.value; save(); invalidateVideo(); syncClosing(); };
// the viewer shows no confirm() dialogs, so anything that throws work away asks for a second click
function twoStep(id, key, fn) {
  const btn = document.getElementById(id); let armed = 0;
  const disarm = () => { clearTimeout(armed); armed = 0; btn.textContent = T(key); btn.classList.remove("armed"); };
  btn.onclick = () => { if (armed) { disarm(); fn(); } else { btn.textContent = T("sure"); btn.classList.add("armed"); armed = setTimeout(disarm, 4000); } };
}
twoStep("reset", "reset", () => { S = SAMPLE(); openId = null; changed(); render(); renderPalette(); syncSettings(); });
twoStep("justMe", "justMe", () => { S.people = S.people.filter(p => p.id === "me"); S.viewer = "me"; openId = "me"; changed(); render(); });

// backup: the story as a file
const dataStatus = document.getElementById("dataStatus"), fileIn = document.getElementById("fileIn");
document.getElementById("saveFile").onclick = async () => {
  const blob = new Blob([JSON.stringify({ app: "lifelines", v: 2, state: S }, null, 1)], { type: "application/json" });
  const dl = await getDownloads();
  try {
    if (dl) await dl.save({ filename: "lifelines.json", data: blob });
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "lifelines.json"; document.body.append(a); a.click(); a.remove(); }
    dataStatus.textContent = T("fileSaved");
  } catch (e) { dataStatus.textContent = e && e.code === "declined" ? "" : T("fileFail"); }
};
document.getElementById("loadFile").onclick = () => fileIn.click();
fileIn.onchange = () => {
  const f = fileIn.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result), s = o && o.state || o;
      if (!s || !Array.isArray(s.people) || !s.people.some(p => p && p.id === "me")) throw 0;
      S = { ...SAMPLE(), ...s }; S.colors = { ...DEFAULT_COLORS, ...(s.colors || {}) }; openId = null;
      changed(); render(); renderPalette(); syncSettings(); t = Math.min(t, tEnd());
      dataStatus.textContent = T("fileLoaded");
    } catch (e) { dataStatus.textContent = T("fileBad"); }
    fileIn.value = "";
  };
  r.readAsText(f);
};

// tabs
const TABS = { people: ["tabBtnPeople", "tabPeople"], look: ["tabBtnLook", "tabLook"] };
function setTab(k) {
  if (!TABS[k]) k = "people";
  for (const [name, [b, p]] of Object.entries(TABS)) { document.getElementById(b).setAttribute("aria-selected", name === k); document.getElementById(p).hidden = name !== k; }
  try { localStorage.setItem("lifelines-tab", k); } catch (e) {}
}
for (const [name, [b]] of Object.entries(TABS)) document.getElementById(b).onclick = () => setTab(name);

// language
function applyLang() {
  document.documentElement.lang = lang;
  for (const n of document.querySelectorAll("[data-i18n]")) n.textContent = T(n.dataset.i18n);
  for (const n of document.querySelectorAll("[data-i18n-html]")) n.innerHTML = T(n.dataset.i18nHtml);
  for (const n of document.querySelectorAll("[data-i18n-aria]")) n.setAttribute("aria-label", T(n.dataset.i18nAria));
  for (const b of document.querySelectorAll(".add button")) b.textContent = "+ " + T("role_" + b.dataset.role);
  document.getElementById("langCs").setAttribute("aria-pressed", lang === "cs");
  document.getElementById("langEn").setAttribute("aria-pressed", lang === "en");
  recBtn.textContent = T(recBtn.dataset.mode === "save" ? "saveVideo" : "record");
  fsBtn.title = T("fs"); fsBtn.setAttribute("aria-label", T("fs"));
  setPlaying(playing); syncMusic();
  sim = null; VIEW = null;
  render(); renderPalette(); syncSettings(); renderViewer(); updateDuration(); markSample(); tintAdd();
}
function setLang(l) {
  if (l === lang) return;
  const old = lang; lang = l;
  try { localStorage.setItem(LANG_STORE, l); } catch (e) {}
  relocalize(old, l); save(); setStatus("", ""); dataStatus.textContent = ""; applyLang();
}
document.getElementById("langCs").onclick = () => setLang("cs");
document.getElementById("langEn").onclick = () => setLang("en");

let startTab = "people"; try { startTab = localStorage.getItem("lifelines-tab") || "people"; } catch (e) {}
setTab(startTab); applyLang();
requestAnimationFrame(frame);
window.renderAt = v => { t = v; setPlaying(false); simTo(t); draw(t, performance.now()); };
if (document.fonts) document.fonts.ready.then(() => { sim = null; });
})();
</script>
